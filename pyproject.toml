[tool.titlemcp.monorepo]
core_package = "packages/titlemcp"
jurisdiction_packages = "packages/jurisdictions"
jurisdiction_catalog = "jurisdiction-catalog"

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/titlemcp/src",
    "packages/titlemcp/tests",
    "packages/titlemcp/examples",
    "packages/jurisdictions",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
