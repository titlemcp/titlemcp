name: CodeQL

# Static security analysis, free for public repositories. It runs on a schedule
# as well as on changes, because a finding often arrives from a rule added after
# the code was written rather than from the code changing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "24 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
