name: Publish Python Package

on:
  workflow_dispatch:
    inputs:
      package-path:
        description: "Publishable package directory"
        required: true
        default: "packages/titlemcp"
      publish:
        description: "Publish to PyPI after build checks"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Audit jurisdiction readiness
        run: |
          if [ -f "${{ inputs.package-path }}/titlemcp-capability.toml" ]; then
            if [ "${{ inputs.publish }}" = "true" ]; then
              python scripts/audit_jurisdiction_package.py \
                "${{ inputs.package-path }}" \
                --require-publish-ready
            else
              python scripts/audit_jurisdiction_package.py "${{ inputs.package-path }}"
            fi
          fi

      - name: Install package for tests
        run: |
          if [ "${{ inputs.package-path }}" != "packages/titlemcp" ]; then
            python -m pip install -e packages/titlemcp
          fi
          python -m pip install -e "${{ inputs.package-path }}"

      - name: Run package tests
        run: |
          if [ -d "${{ inputs.package-path }}/tests" ]; then
            python -m unittest discover -s "${{ inputs.package-path }}/tests" -v
          fi

      - name: Build package
        working-directory: ${{ inputs.package-path }}
        run: python -m build

      - name: Check package metadata
        working-directory: ${{ inputs.package-path }}
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: ${{ inputs.package-path }}/dist/*

  publish:
    name: Publish to PyPI
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
