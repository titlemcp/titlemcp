name: CI

# Every push to main and every pull request, including from forks. Without this
# a contributor opening a pull request gets no signal at all, and the maintainer
# has to run the suite locally to find out whether it is green.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to a branch makes the run already in flight pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The jurisdiction catalog is six figures of small files and no test
          # reads its history.
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # With the test extra, so the optional paths are covered rather than
          # skipped: Pillow is optional at runtime and three image tests need it.
          python -m pip install -e "packages/titlemcp[test]"
          # Held to one minor version. The formatter's output can change between
          # them, and an unpinned install would fail a pull request over layout
          # its author never touched.
          python -m pip install "ruff>=0.16,<0.17"

      # Ruff is the project's linter and formatter, configured in pyproject:
      # line length 100, target py312, rules E,F,I,UP,B.
      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check --diff .

      - name: Test
        run: python -m unittest discover -s packages/titlemcp/tests -v

      - name: Package builds and its metadata is valid
        run: |
          python -m pip install build twine
          python -m build packages/titlemcp
          python -m twine check packages/titlemcp/dist/*

  packages:
    # The Docker image and scripts/install.sh install every package together, so
    # each package's suite runs with all of them installed.
    name: Every package, installed together
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The core takes its version from the tags, and the county packages
          # require a minimum core version.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: ./scripts/install.sh

      - name: Test each package
        run: |
          status=0
          for tests in $(find packages/platforms packages/jurisdictions -type d -name tests | sort); do
            echo "::group::$tests"
            .venv/bin/python -m unittest discover -s "$tests" -v || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Every county package passes the publish audit
        run: |
          status=0
          for package in $(find packages/jurisdictions -name titlemcp-capability.toml -exec dirname {} \; | sort); do
            .venv/bin/python scripts/audit_jurisdiction_package.py --require-publish-ready "$package" || status=1
          done
          exit $status

  image:
    # The deploy buttons in the README all build this Dockerfile. A hosting
    # platform passes its port as PORT and sits behind a proxy that ends TLS.
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build
        run: docker build -t titlemcp:ci .

      - name: Serves on the port the platform gives it
        run: |
          docker run -d --name titlemcp -e PORT=10000 -p 10000:10000 titlemcp:ci
          for attempt in $(seq 1 30); do
            curl -fs http://localhost:10000/healthz && break
            sleep 1
          done
          curl -fs http://localhost:10000/healthz || { docker logs titlemcp; exit 1; }

      - name: Advertises the https endpoint behind a proxy
        run: |
          url=$(curl -fs -H "Host: titlemcp.example.com" -H "X-Forwarded-Proto: https" \
            http://localhost:10000/ | python -c "import json, sys; print(json.load(sys.stdin)['mcp']['url'])")
          echo "$url"
          test "$url" = "https://titlemcp.example.com/mcp"

      - name: Loads every county package
        # One source connector from each county package, registered by its plugin.
        run: |
          docker run --rm -i titlemcp:ci python - <<'EOF'
          import asyncio

          from title_mcp.platform import TitleMCPPlatform
          from title_mcp.settings import TitleMCPSettings

          platform = TitleMCPPlatform(settings=TitleMCPSettings())
          asyncio.run(platform.initialize())
          loaded = {connector.source_id for connector in platform.sources.all()}
          expected = {
              "us-ca-contra-costa-tax",
              "us-co-arapahoe-recorder",
              "us-dc-otr-tax",
              "us-fl-municipal-directory",
              "us-il-dupage-tax",
              "us-il-lake-recorder",
              "us-nm-bernalillo-tax",
              "us-oh-cuyahoga-recorder",
              "us-oh-franklin-auditor",
              "us-oh-franklin-recorder",
              "us-pa-delaware-recorder",
              "us-pa-delaware-tax",
              "us-sc-greenville-recorder",
              "us-tn-shelby-tax",
              "us-tx-dallas-recorder",
              "us-va-fairfax-tax",
          }
          missing = expected - loaded
          print(f"{len(loaded)} source connectors loaded")
          assert not missing, f"not loaded: {sorted(missing)}"
          EOF
