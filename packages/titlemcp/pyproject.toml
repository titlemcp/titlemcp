[project]
name = "titlemcp"
version = "0.1.0"
description = "Reusable MCP platform for title and real estate service operations."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [
    { name = "Razi Title MCP Contributors" },
]
maintainers = [
    { name = "Razi Title MCP Contributors" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "title",
    "real-estate",
    "workflow",
    "ollama",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.27.1,<2.0",
    "ollama>=0.6.2,<1.0",
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings>=2.14.1,<3.0",
    "requests>=2.32.0,<3.0",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.35.0",
]
postgres = [
    "asyncpg>=0.30.0",
]
"us-oh-franklin" = [
    "titlemcp-us-oh-franklin-recorder>=0.1.0",
]
"us-oh-franklin-recorder" = [
    "titlemcp-us-oh-franklin-recorder>=0.1.0",
]
jurisdictions = [
    "titlemcp-us-oh-franklin-recorder>=0.1.0",
]
publish = [
    "build>=1.2.0",
    "twine>=5.0.0",
]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "twine>=5.0.0",
]

[project.scripts]
titlemcp-server = "title_mcp.mcp.server:main"
titlemcp-ollama = "title_mcp.client.ollama_bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/.venv",
    "/dist",
    "/build",
    "/.pytest_cache",
    "/.ruff_cache",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/scripts",
    "/templates",
    "/README.md",
    "/LICENSE",
    "/.env.example",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/title_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
