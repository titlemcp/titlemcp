[project]
name = "titlemcp-platform-publicsearch"
version = "0.1.0"
description = "Shared client for county recorders on Kofile's PublicSearch platform, for TitleMCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "titlemcp>=0.3.4",
    "websockets>=14.0,<16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/titlemcp_platform_publicsearch"]
