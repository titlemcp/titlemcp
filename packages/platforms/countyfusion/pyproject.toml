[project]
name = "titlemcp-platform-countyfusion"
version = "0.1.0"
description = "Shared client for county recorders on Kofile's CountyFusion platform, for TitleMCP."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "titlemcp>=0.3.4",
    "requests>=2.32.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/titlemcp_platform_countyfusion"]
