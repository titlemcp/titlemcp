[project]
name = "titlemcp-us-dc-tax"
version = "0.1.0"
description = "District of Columbia real property tax status for TitleMCP, from the District's open data extract."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "titlemcp>=0.3.6",
]

[project.entry-points."title_mcp.adapters"]
us_dc_tax = "titlemcp_us_dc_tax.adapters:DistrictOfColumbiaTaxCertificateAdapter"

[project.entry-points."title_mcp.sources"]
us_dc_tax = "titlemcp_us_dc_tax.connector:DistrictOfColumbiaTaxConnector"

[project.entry-points."title_mcp.capabilities"]
us_dc_tax = "titlemcp_us_dc_tax.manifest:capability_manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/pyproject.toml",
    "/titlemcp-capability.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/titlemcp_us_dc_tax"]
