[project]
name = "titlemcp-us-tn-tax"
version = "0.1.0"
description = "Shelby County, Tennessee county property tax status for TitleMCP, from the Trustee's Tax Query."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "titlemcp>=0.3.6",
]

[project.entry-points."title_mcp.adapters"]
us_tn_tax = "titlemcp_us_tn_tax.adapters:ShelbyCountyTaxCertificateAdapter"

[project.entry-points."title_mcp.sources"]
us_tn_tax = "titlemcp_us_tn_tax.connector:ShelbyCountyTaxConnector"

[project.entry-points."title_mcp.capabilities"]
us_tn_tax = "titlemcp_us_tn_tax.manifest:capability_manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/titlemcp-capability.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/titlemcp_us_tn_tax"]
