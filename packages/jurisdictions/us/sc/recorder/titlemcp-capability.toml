[capability]
capability_id = "us-sc-recorder"
package_name = "titlemcp-us-sc-recorder"
version = "0.1.0"

[jurisdiction]
# Multi-county package. The covered counties are enumerated in
# src/titlemcp_us_sc_recorder/sites.py.
country = "US"
state = "SC"

[workflows.release_tracking]
status = "draft"
adapter = "implemented"
source_connector = "implemented"
human_review_required = true

[readiness]
docs = true
unit_tests = true
# Fixtures are invented and shaped like the counties' responses; the platform
# package's tests drive them.
fixtures = true
# Checked by hand against the live indexes; no live test is in the default suite.
integration_tests = false
no_live_credentials = true
pypi_metadata = true
reviewer_approved = false

[release]
publish = false
