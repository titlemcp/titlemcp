[project]
name = "titlemcp-us-oh-franklin-recorder"
version = "0.1.0"
description = "Franklin County, Ohio recorder adapter for TitleMCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "titlemcp>=0.1.0",
    "websockets>=14.0,<16.0",
]

[project.entry-points."title_mcp.adapters"]
us_oh_franklin_recorder = "titlemcp_us_oh_franklin_recorder.adapters:FranklinCountyOhioRecorderAdapter"

[project.entry-points."title_mcp.sources"]
us_oh_franklin_recorder = "titlemcp_us_oh_franklin_recorder.sources:FranklinRecorderSourceConnector"
us_oh_franklin_auditor = "titlemcp_us_oh_franklin_recorder.sources:FranklinAuditorSourceConnector"

[project.entry-points."title_mcp.toolsets"]
us_oh_franklin_auditor = "titlemcp_us_oh_franklin_recorder.toolsets:FranklinAuditorToolset"

[project.entry-points."title_mcp.capabilities"]
us_oh_franklin_recorder = "titlemcp_us_oh_franklin_recorder.manifest:capability_manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/pyproject.toml",
    "/titlemcp-capability.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/titlemcp_us_oh_franklin_recorder"]
