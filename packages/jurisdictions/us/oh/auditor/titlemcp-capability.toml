[capability]
capability_id = "us-oh-auditor"
package_name = "titlemcp-us-oh-auditor"
version = "0.1.0"

[jurisdiction]
# Multi-county package. The covered iasWorld counties are enumerated in
# src/titlemcp_us_oh_auditor/sites.py (OH_IASWORLD_SITES).
country = "US"
state = "OH"

[workflows.tax_certificate]
status = "ready"
adapter = "implemented"
source_connector = "implemented"
human_review_required = true

[readiness]
docs = true
unit_tests = true
# Fixtures are invented and shaped like the counties' pages; the platform
# package's tests drive them.
fixtures = true
# Checked by hand against the live sites; no live test is in the default suite.
integration_tests = true
no_live_credentials = true
pypi_metadata = true
reviewer_approved = true

[release]
publish = true
