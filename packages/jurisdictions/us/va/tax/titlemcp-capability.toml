[capability]
capability_id = "us-va-tax"
package_name = "titlemcp-us-va-tax"
version = "0.1.0"

[jurisdiction]
# Multi-county package. The covered counties are enumerated in
# src/titlemcp_us_va_tax/sites.py.
country = "US"
state = "VA"

[workflows.tax_certificate]
status = "ready"
adapter = "implemented"
source_connector = "implemented"
human_review_required = true

[readiness]
docs = true
unit_tests = true
# Fixtures are invented and shaped like the county's pages; the platform
# package's tests drive them.
fixtures = true
# Checked by hand against the live site; no live test is in the default suite.
integration_tests = true
no_live_credentials = true
pypi_metadata = true
reviewer_approved = true

[release]
publish = true
