[project]
name = "titlemcp-us-fl-municipal"
version = "0.1.0"
description = "Florida municipal lien directory for TitleMCP: who issues each lien letter and where permits and code cases are."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "titlemcp>=0.3.7",
]

[project.entry-points."title_mcp.adapters"]
us_fl_municipal = "titlemcp_us_fl_municipal.adapters:FloridaMunicipalLienSearchAdapter"

[project.entry-points."title_mcp.sources"]
us_fl_municipal = "titlemcp_us_fl_municipal.connector:FloridaMunicipalDirectory"

[project.entry-points."title_mcp.capabilities"]
us_fl_municipal = "titlemcp_us_fl_municipal.manifest:capability_manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/pyproject.toml",
    "/titlemcp-capability.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/titlemcp_us_fl_municipal"]
