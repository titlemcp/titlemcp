[project]
name = "titlemcp-us-ca-tax"
version = "0.1.0"
description = "Contra Costa County, California secured property tax status for TitleMCP, from the county's tax lookup."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "titlemcp>=0.3.6",
]

[project.entry-points."title_mcp.adapters"]
us_ca_tax = "titlemcp_us_ca_tax.adapters:ContraCostaTaxCertificateAdapter"

[project.entry-points."title_mcp.sources"]
us_ca_tax = "titlemcp_us_ca_tax.connector:ContraCostaTaxConnector"

[project.entry-points."title_mcp.capabilities"]
us_ca_tax = "titlemcp_us_ca_tax.manifest:capability_manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/titlemcp-capability.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/titlemcp_us_ca_tax"]
